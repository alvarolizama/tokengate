<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    TokenGate mark — colores del tema `dim` (primary del tema, ver DESIGN.md §Paleta).
      · primary           #9fe88d  oklch(86.133% 0.141 139.549)   (stop 1 + nodos)
      · success           #62efbd  oklch(86.171% 0.142 166.534)   (stop 2 + líneas)
      · primary 72 (hub)  #6fbb5c  oklch(72% 0.15 139.549)        (derivado)
      · primary 93 (core) #c9f7be  oklch(93% 0.09 139.549)        (derivado)
    Al cambiar el primary del tema, actualizar en el mismo commit:
    priv/static/favicon.svg, priv/static/favicon.ico,
    priv/static/images/logo.png y docs/headers/tokengate-logo.png.
  -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tg-gate" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9fe88d"/>
      <stop offset="1" stop-color="#62efbd"/>
    </linearGradient>
  </defs>

  <!-- Gate: hexagon ring (the token) around the hub -->
  <path d="M256 96l139 80v160l-139 80-139-80V176l139-80Z"
        fill="none" stroke="url(#tg-gate)" stroke-width="14"
        stroke-linejoin="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Connection lines: hub → provider nodes -->
  <g stroke="#62efbd" stroke-width="9" stroke-linecap="round" opacity="0.5" filter="url(#glow)">
    <line x1="256" y1="256" x2="164" y2="171"/>
    <line x1="256" y1="256" x2="356" y2="180"/>
    <line x1="256" y1="256" x2="352" y2="352"/>
    <line x1="256" y1="256" x2="160" y2="348"/>
  </g>

  <!-- Provider nodes -->
  <g filter="url(#glow)">
    <circle cx="164" cy="171" r="34" fill="#9fe88d" opacity="0.95"/>
    <circle cx="356" cy="180" r="30" fill="#62efbd" opacity="0.9"/>
    <circle cx="352" cy="352" r="30" fill="#6fbb5c" opacity="0.85"/>
    <circle cx="160" cy="348" r="34" fill="#9fe88d" opacity="0.9"/>
  </g>

  <!-- Gateway hub (main — larger, brighter) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="66" fill="#9fe88d" opacity="0.2"/>
    <circle cx="256" cy="256" r="46" fill="#6fbb5c"/>
    <circle cx="256" cy="256" r="26" fill="#c9f7be"/>
  </g>
</svg>
